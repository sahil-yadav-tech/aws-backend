name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t sahilyadavteche/aws-backend:latest .

      - name: Push Docker Image
        run: |
          docker push sahilyadavteche/aws-backend:latest

      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull sahilyadavteche/aws-backend:latest

            docker stop aws-backend || true
            docker rm aws-backend || true

            docker run -d \
              --name aws-backend \
              -p 2720:2720 \
              --restart unless-stopped \
              sahilyadavteche/aws-backend:latest